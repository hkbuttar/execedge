# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Deploys backend/ and frontend/ as two independent services from the
# same image (see Dockerfile) -- deliberately not one process, even
# though the frontend can run standalone without the backend service
# (frontend/data_access.py calls backend.services in-process, not over
# HTTP). Splitting them means the JSON API + /docs are reachable on
# their own, and either service can be scaled/restarted independently.
#
# To deploy: push this repo to GitHub, then in the Render dashboard use
# "New +" -> "Blueprint" and point it at the repo. Render reads this
# file and creates both services plus the database. Free plan: web
# services spin down after 15 minutes idle and take ~30-60s to wake on
# the next request; the free Postgres instance expires after 30 days
# (Render's own limit) -- fine for a research/portfolio project, but
# worth knowing before relying on it.
#
# execedge-db holds one table (book_snapshots, see db/schema.py) -- the
# DB-backed alternative to lob/raw/*_book_snapshots.jsonl, so recorded
# book history survives a restart instead of living only on the web
# services' ephemeral disk. Nothing reads from it automatically: pass
# `db:<venue>` (e.g. `db:binance`) as any book_history_path field/CLI
# flag to opt in -- see backtest/book_history.py's open_book_history()
# and DEPLOYMENT.md.
databases:
  - name: execedge-db
    plan: free
    databaseName: execedge
    user: execedge

services:
  - type: web
    name: execedge-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    dockerCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: execedge-db
          property: connectionString
    healthCheckPath: /health

  - type: web
    name: execedge-frontend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # --allow-websocket-origin must match the public hostname or Bokeh
    # refuses the UI's websocket connection; RENDER_EXTERNAL_HOSTNAME is
    # set automatically by Render on every web service. --use-xheaders
    # is needed because Render terminates TLS at its proxy and forwards
    # via X-Forwarded-* headers, which Bokeh must trust to get the
    # origin check right.
    dockerCommand: >-
      bash -c "bokeh serve frontend/app.py --port $PORT --address 0.0.0.0
      --allow-websocket-origin=$RENDER_EXTERNAL_HOSTNAME --use-xheaders"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: execedge-db
          property: connectionString
