# Local equivalent of render.yaml's two services, for testing the
# containerized build before pushing to Render.
#
#   docker compose up --build
#
# Backend: http://localhost:8000 (docs at /docs)
# Frontend: http://localhost:5006/app
services:
  backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  frontend:
    build: .
    command: >-
      bokeh serve frontend/app.py --port 5006 --address 0.0.0.0
      --allow-websocket-origin=localhost:5006
    ports:
      - "5006:5006"
